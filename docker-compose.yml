services:
  db:
    image: pgvector/pgvector:pg16
    container_name: course-index-db
    environment:
      POSTGRES_USER: courseindex
      POSTGRES_PASSWORD: courseindex
      POSTGRES_DB: courseindex
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseindex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
